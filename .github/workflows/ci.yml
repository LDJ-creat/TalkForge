name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install @rollup/rollup-linux-x64-gnu@4.61.1 --no-save --no-audit --no-fund

      - name: Run tests
        run: npm run test

      - name: Build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talkforge
          STORAGE_SIGNING_SECRET: ci-build-storage-signing-secret
        run: npm run build
