name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          # Work around npm optional-dependency bug (rollup native binaries on Linux).
          npm install --no-save --no-audit --no-fund

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
